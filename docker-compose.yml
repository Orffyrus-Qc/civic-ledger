# Canadian Political Leak — sandbox stack
# Internal network only. Host binds are 127.0.0.1.
# LLM pinned to GPU 1 (RTX 3060) so GPU 0 video jobs stay untouched.

name: cpl

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: cpl-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_LIMITER: "false"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      sandbox:
        aliases: [searxng]
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 25s

  llm:
    image: docker.io/ollama/ollama:latest
    container_name: cpl-llm
    restart: unless-stopped
    gpus: all
    environment:
      # Host GPU 1 — RTX 3060 12 GB. Model is sized for 8 GB VRAM.
      # Docker Desktop exposes both cards; CUDA_VISIBLE_DEVICES pins the 3060.
      CUDA_VISIBLE_DEVICES: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - cpl_llm:/root/.ollama
    networks:
      sandbox:
        aliases: [llm]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "4m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  llm-pull:
    image: docker.io/ollama/ollama:latest
    container_name: cpl-llm-pull
    depends_on:
      llm:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://llm:11434
    entrypoint: ["ollama", "pull", "qwen3:8b"]
    networks:
      - sandbox
    restart: "no"
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: cpl-app:latest
    container_name: cpl-app
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
      llm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      CPL_BIND: 0.0.0.0
      CPL_PORT: "8088"
      CPL_DB_PATH: /data/cpl.sqlite
      SEARXNG_URL: http://searxng:8080
      OLLAMA_URL: http://llm:11434
      OLLAMA_MODEL: qwen3:8b
      SCAN_INTERVAL_MINUTES: "30"
      SCAN_ON_START: "0"
      PUBLIC_ONLY: "1"
      CPL_BACKUP_DIR: /data/backups
      CPL_CACHE_DIR: /data/cache
      OLLAMA_NUM_CTX: "6144"
    volumes:
      - cpl_data:/data
      - ./cache:/data/cache
    networks:
      sandbox:
        aliases: [app]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "4m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=5)\""]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 40s

networks:
  sandbox:
    name: cpl_sandbox
    driver: bridge
    internal: false

volumes:
  cpl_data:
    name: cpl_data
  cpl_llm:
    name: cpl_llm
